server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**, /admin/**,/user/**

        - id: land-service
          uri: http://localhost:8082
          predicates:
            - Path=/lands/**, /admin/lands/**,public/all
server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: User_Service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**,/user/**,/admin/users/**

        - id: Land_Service
          uri: http://localhost:8082
          predicates:
            - Path=/lands/**,/admin/lands/**,/public/**